name: rtsp_hub
description: Aplicativo multiplataforma para visualização de câmeras RTSP.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  window_manager: ^0.5.2
  uuid: ^4.6.0
  crypto: ^3.0.7
  xml: ^7.0.1
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/logo.svg

