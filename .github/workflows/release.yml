name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Validar APK Android
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Instalar dependências de compilação
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libepoxy-dev libsecret-1-dev dpkg-dev
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - name: Criar pacote Debian
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: RELEASE_VERSION="${RELEASE_VERSION#v}" tool/package_linux_deb.sh
      - name: Validar pacote Debian
        shell: bash
        run: |
          set -euo pipefail
          package=(dist/*.deb)
          test -f "${package[0]}"
          test "$(dpkg-deb -f "${package[0]}" Package)" = "rtsp-hub"
          install_root="$(mktemp -d)"
          dpkg-deb -x "${package[0]}" "$install_root"
          test -x "$install_root/opt/rtsp-hub/RTSPHub"
          test -x "$install_root/usr/bin/rtsp-hub"
          test -f "$install_root/usr/share/applications/rtsp-hub.desktop"
          test -f "$install_root/usr/share/icons/hicolor/256x256/apps/rtsp-hub.png"
          test -f "$install_root/usr/share/pixmaps/rtsp-hub.png"
          test -n "$(find "$install_root/opt/rtsp-hub/lib" -maxdepth 1 -name 'libmpv.so.*' -print -quit)"
          rm -rf "$install_root"
      - name: Testar instalação e abertura no Ubuntu
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb
          sudo dpkg -i dist/*.deb
          test -x /opt/rtsp-hub/RTSPHub
          set +e
          timeout 12s xvfb-run -a rtsp-hub --config
          exit_code=$?
          set -e
          test "$exit_code" -eq 124
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-installer
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Validar executável Windows
        shell: pwsh
        run: |
          if (!(Test-Path build\windows\x64\runner\Release\rtsp_hub.exe)) { throw "Executável Windows ausente" }
      - name: Incluir runtime Visual C++ no aplicativo
        shell: pwsh
        run: ./tool/package_windows_runtime.ps1 -ReleaseDir build\windows\x64\runner\Release
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Criar instalador Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tool/windows-installer.iss
      - name: Validar instalador Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\RTSP-Hub-Setup-*-x64.exe | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -lt 1000000) { throw "Instalador inválido ou vazio" }
      - name: Testar instalação e abertura no Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\RTSP-Hub-Setup-*-x64.exe | Select-Object -First 1
          $installDir = Join-Path $env:RUNNER_TEMP 'rtsp-hub-smoke'
          $result = Start-Process -FilePath $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installDir" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Instalação Windows falhou: $($result.ExitCode)" }
          $application = Join-Path $installDir 'rtsp_hub.exe'
          if (!(Test-Path $application)) { throw 'Executável instalado ausente' }
          foreach ($library in @('flutter_windows.dll', 'libmpv-2.dll', 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')) {
            if (!(Test-Path (Join-Path $installDir $library))) { throw "Biblioteca ausente no instalador: $library" }
          }
          $process = Start-Process -FilePath $application -WorkingDirectory $installDir -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "Aplicativo Windows encerrou ao abrir: $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    needs: [android, ubuntu, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Conferir artefatos e gerar checksums
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          test -n "$(find release-assets -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          (cd release-assets && sha256sum *.apk *.deb *.exe > SHA256SUMS)
      - name: Criar release e anexar instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "RTSP Hub $TAG" --notes "Instaladores para Windows e Ubuntu, além do APK para Android."
          fi
