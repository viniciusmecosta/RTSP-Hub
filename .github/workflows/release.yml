name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Instalar dependências de compilação
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libepoxy-dev libsecret-1-dev dpkg-dev
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - name: Criar pacote Debian
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: RELEASE_VERSION="${RELEASE_VERSION#v}" tool/package_linux_deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-installer
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Criar instalador Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tool/windows-installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    needs: [android, ubuntu, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Criar release e anexar instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "RTSP View $TAG" --notes "Instaladores para Windows e Ubuntu, além do APK para Android."
          fi
