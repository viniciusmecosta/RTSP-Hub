name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - name: Validar APK Android
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  ubuntu:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - name: Instalar dependências de compilação
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libmpv-dev libepoxy-dev libsecret-1-dev dpkg-dev
      - run: flutter pub get
      - run: flutter analyze && flutter test
      - name: Criar pacote Debian
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: RELEASE_VERSION="${RELEASE_VERSION#v}" tool/package_linux_deb.sh
      - name: Validar pacote Debian
        shell: bash
        run: |
          set -euo pipefail
          package=(dist/*.deb)
          test -f "${package[0]}"
          test "$(dpkg-deb -f "${package[0]}" Package)" = "rtsp-view"
          install_root="$(mktemp -d)"
          dpkg-deb -x "${package[0]}" "$install_root"
          test -x "$install_root/opt/rtsp-view/RTSPView"
          test -x "$install_root/usr/bin/rtsp-view"
          test -f "$install_root/usr/share/applications/rtsp-view.desktop"
          rm -rf "$install_root"
      - uses: actions/upload-artifact@v4
        with:
          name: ubuntu-installer
          path: dist/*.deb
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Validar executável Windows
        shell: pwsh
        run: |
          if (!(Test-Path build\windows\x64\runner\Release\rtsp_view.exe)) { throw "Executável Windows ausente" }
      - name: Instalar Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Criar instalador Windows
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" tool/windows-installer.iss
      - name: Validar instalador Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist\RTSP-View-Setup-*-x64.exe | Select-Object -First 1
          if ($null -eq $installer -or $installer.Length -lt 1000000) { throw "Instalador inválido ou vazio" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 2

  publish:
    needs: [android, ubuntu, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Conferir artefatos e gerar checksums
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 3
          test -n "$(find release-assets -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.deb' -print -quit)"
          test -n "$(find release-assets -maxdepth 1 -name '*.exe' -print -quit)"
          (cd release-assets && sha256sum *.apk *.deb *.exe > SHA256SUMS)
      - name: Criar release e anexar instaladores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* --verify-tag --title "RTSP View $TAG" --notes "Instaladores para Windows e Ubuntu, além do APK para Android."
          fi
